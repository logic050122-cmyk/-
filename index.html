<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日蛋糕透明悬浮版</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }

    body {
      position: relative;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent;
      perspective: 1100px;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 220, 120, 0.12), transparent 24%),
        radial-gradient(circle at 28% 42%, rgba(80, 180, 255, 0.14), transparent 30%),
        radial-gradient(circle at 72% 46%, rgba(255, 70, 180, 0.12), transparent 32%);
      animation: ambientBreath 3.4s ease-in-out infinite;
    }

    .beam {
      position: absolute;
      top: 8%;
      width: 34vw;
      height: 84vh;
      z-index: 1;
      opacity: 0.52;
      filter: blur(10px);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .beam-left {
      left: 4%;
      background: linear-gradient(105deg, transparent 12%, rgba(80, 180, 255, 0.22), transparent 68%);
      transform: rotate(-8deg);
      animation: beamMoveLeft 5s ease-in-out infinite;
    }

    .beam-right {
      right: 4%;
      background: linear-gradient(75deg, transparent 12%, rgba(255, 90, 190, 0.2), transparent 68%);
      transform: rotate(8deg);
      animation: beamMoveRight 5.6s ease-in-out infinite;
    }

    .wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vh, 560px);
      aspect-ratio: 720 / 924;
      opacity: 0;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) translateY(26px) scale(0.72) rotateX(8deg);
      animation: hologramIn 1350ms cubic-bezier(.16,.9,.18,1) forwards;
      pointer-events: none;
      z-index: 3;
    }

    .wrap::before,
    .wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 130%;
      height: 130%;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .wrap::before {
      background: radial-gradient(circle at center, rgba(255, 215, 105, 0.22), transparent 46%);
      filter: blur(34px);
      animation: coreGlow 2.8s ease-in-out infinite;
    }

    .wrap::after {
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 0 45px rgba(255, 215, 105, 0.15),
        inset 0 0 65px rgba(80, 180, 255, 0.08);
      opacity: 0.65;
      animation: auraRotate 8s linear infinite;
    }

    .shockwave {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 225, 130, 0.45);
      box-shadow: 0 0 30px rgba(255, 225, 130, 0.25);
      opacity: 0;
      z-index: 2;
      animation: shockwave 1200ms ease-out 120ms forwards;
    }

    .halo-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 2;
    }

    .halo-ring.one {
      width: min(78vh, 600px);
      height: min(78vh, 600px);
      transform: translate(-50%, -50%) rotateX(68deg) rotateZ(0deg);
      border: 1px solid rgba(255, 220, 120, 0.32);
      box-shadow: 0 0 26px rgba(255, 220, 120, 0.14);
      animation: ringSpin 6s linear infinite;
    }

    .halo-ring.two {
      width: min(88vh, 680px);
      height: min(88vh, 680px);
      transform: translate(-50%, -50%) rotateX(70deg) rotateZ(38deg);
      border: 1px dashed rgba(80, 190, 255, 0.22);
      box-shadow: 0 0 30px rgba(80, 190, 255, 0.08);
      animation: ringSpinReverse 9s linear infinite;
    }

    .halo-ring.three {
      width: min(58vh, 460px);
      height: min(58vh, 460px);
      transform: translate(-50%, -50%) rotateX(72deg) rotateZ(-25deg);
      border: 1px solid rgba(255, 80, 190, 0.18);
      animation: ringSpin 7.5s linear infinite;
    }

    .glow {
      position: absolute;
      inset: -70px;
      background:
        radial-gradient(circle at center, rgba(255, 215, 105, 0.30), transparent 43%),
        radial-gradient(circle at 50% 36%, rgba(82, 190, 255, 0.26), transparent 40%),
        radial-gradient(circle at 50% 70%, rgba(255, 65, 180, 0.20), transparent 43%);
      filter: blur(32px);
      opacity: 0.95;
      pointer-events: none;
      animation: glowFloat 2.6s ease-in-out infinite;
    }

    .video-shell {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.02);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 26px rgba(255, 255, 255, 0.08),
        0 0 70px rgba(255, 210, 95, 0.22),
        0 0 125px rgba(75, 185, 255, 0.18),
        0 0 185px rgba(255, 65, 180, 0.10);
      backdrop-filter: blur(0.5px);
      transform: translateZ(20px);
    }

    .video-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.12) 18%, transparent 34%, transparent 100%),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0 1px, transparent 1px 5px);
      mix-blend-mode: screen;
      animation: scanMove 4s linear infinite;
    }

    .video-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 44%, rgba(0,0,0,0.12) 82%, rgba(0,0,0,0.2) 100%),
        linear-gradient(to right, rgba(0,0,0,0.18), transparent 10%, transparent 90%, rgba(0,0,0,0.18));
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0.96;
      filter: saturate(1.16) brightness(1.05) contrast(1.02);
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(ellipse at center, black 58%, rgba(0,0,0,0.9) 76%, transparent 100%);
      mask-image: radial-gradient(ellipse at center, black 58%, rgba(0,0,0,0.9) 76%, transparent 100%);
    }

    .light-dust {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow:
        -260px -180px 0 rgba(255,216,77,.65),
        240px -130px 0 rgba(77,184,255,.58),
        -310px 90px 0 rgba(255,79,163,.58),
        300px 145px 0 rgba(255,122,0,.55),
        -180px 210px 0 rgba(255,255,255,.42),
        210px 220px 0 rgba(124,255,107,.42);
      filter: blur(0.2px);
      opacity: 0.8;
      z-index: 4;
      animation: dustPulse 1.8s ease-in-out infinite;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.34);
      white-space: nowrap;
      opacity: 0;
      z-index: 5;
      animation: fadeIn 1s ease 1.1s forwards;
      text-shadow: 0 0 12px rgba(255,255,255,0.22);
    }

    @keyframes hologramIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(42px) scale(0.62) rotateX(18deg);
        filter: blur(18px) brightness(1.8);
      }
      42% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(-8px) scale(1.06) rotateX(0deg);
        filter: blur(0) brightness(1.14);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(1) rotateX(0deg);
        filter: blur(0) brightness(1);
      }
    }

    @keyframes shockwave {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(11); }
    }

    @keyframes ambientBreath {
      0%, 100% { opacity: 0.82; }
      50% { opacity: 1; }
    }

    @keyframes glowFloat {
      0%, 100% { transform: scale(1); opacity: 0.88; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    @keyframes coreGlow {
      0%, 100% { opacity: 0.72; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    @keyframes auraRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes ringSpin {
      from { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(0deg); }
      to { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(360deg); }
    }

    @keyframes ringSpinReverse {
      from { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); }
      to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); }
    }

    @keyframes beamMoveLeft {
      0%, 100% { transform: rotate(-9deg) translateX(0); opacity: 0.38; }
      50% { transform: rotate(-4deg) translateX(30px); opacity: 0.62; }
    }

    @keyframes beamMoveRight {
      0%, 100% { transform: rotate(9deg) translateX(0); opacity: 0.34; }
      50% { transform: rotate(4deg) translateX(-30px); opacity: 0.58; }
    }

    @keyframes scanMove {
      from { background-position: -260px 0, 0 0; }
      to { background-position: 360px 0, 0 80px; }
    }

    @keyframes dustPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.55; }
      50% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.95; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 900px) {
      .wrap {
        width: min(82vw, 62vh);
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="ambient"></div>
    <div class="beam beam-left"></div>
    <div class="beam beam-right"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="shockwave"></div>
    <div class="halo-ring one"></div>
    <div class="halo-ring two"></div>
    <div class="halo-ring three"></div>

    <div class="wrap">
      <div class="glow"></div>
      <div class="video-shell">
        <video id="mainVideo" autoplay muted loop playsinline preload="auto">
          <source src="生日蛋糕3.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="light-dust"></div>
    <div class="hint">Ctrl+Shift+Q 关闭 · Ctrl+Shift+M 切换鼠标穿透</div>
  </div>

  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("mainVideo");

    let W = 0;
    let H = 0;
    let particles = [];
    let stars = [];
    let bursts = [];
    let t = 0;

    const COLORS = ["#ffd84d", "#ff4fa3", "#4db8ff", "#ffffff", "#ff7a00", "#7cff6b", "#a78bfa"];

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      createField();
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function createField() {
      particles = [];
      stars = [];
      bursts = [];

      for (let i = 0; i < Math.floor(W * H / 12000); i++) {
        stars.push({
          x: rand(0, W),
          y: rand(0, H),
          r: rand(1.2, 3.8),
          vy: rand(0.08, 0.30),
          vx: rand(-0.05, 0.05),
          alpha: rand(0.16, 0.62),
          glow: rand(1.8, 4.2),
          color: pick(COLORS)
        });
      }

      for (let i = 0; i < Math.floor(W * H / 21000); i++) {
        particles.push(createFloatingParticle(rand(-240, 240), rand(-120, 160)));
      }

      for (let i = 0; i < 90; i++) {
        const a = rand(0, Math.PI * 2);
        const speed = rand(2.0, 7.5);
        bursts.push({
          x: W / 2,
          y: H / 2,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          size: rand(2, 7),
          life: rand(42, 95),
          maxLife: 95,
          rot: rand(0, Math.PI * 2),
          vrot: rand(-0.12, 0.12),
          color: pick(COLORS),
          type: Math.random() > 0.52 ? "star" : "dot"
        });
      }
    }

    function createFloatingParticle(offsetX, offsetY) {
      return {
        x: W / 2 + offsetX,
        y: H / 2 + offsetY,
        vx: rand(-0.75, 0.75),
        vy: rand(-1.9, -0.18),
        size: rand(2, 6.5),
        life: rand(60, 145),
        maxLife: 145,
        rot: rand(0, Math.PI * 2),
        vrot: rand(-0.09, 0.09),
        color: pick(COLORS),
        type: Math.random() > 0.58 ? "star" : "dot"
      };
    }

    function drawStar(x, y, r, color, rot = 0, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const outer = (-90 + i * 72) * Math.PI / 180;
        const inner = (-90 + i * 72 + 36) * Math.PI / 180;
        ctx.lineTo(Math.cos(outer) * r, Math.sin(outer) * r);
        ctx.lineTo(Math.cos(inner) * r * 0.45, Math.sin(inner) * r * 0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawParticle(p, alpha) {
      if (p.type === "star") {
        drawStar(p.x, p.y, p.size * 1.35, p.color, p.rot, alpha);
        return;
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = alpha * 0.24;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function updateStars() {
      for (const s of stars) {
        s.y -= s.vy;
        s.x += s.vx + Math.sin(t + s.y * 0.01) * 0.035;

        if (s.y < -10) {
          s.y = H + 10;
          s.x = rand(0, W);
        }

        ctx.globalAlpha = s.alpha * (0.72 + Math.sin(t * 2 + s.x * 0.02) * 0.22);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha *= 0.18;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * s.glow, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx + Math.sin(t + i * 0.35) * 0.08;
        p.y += p.vy;
        p.life -= 1;
        p.rot += p.vrot;

        const alpha = Math.max(0, p.life / p.maxLife) * 0.86;
        drawParticle(p, alpha);

        if (p.life <= 0 || p.y < -40) {
          particles[i] = createFloatingParticle(rand(-240, 240), rand(30, 210));
        }
      }
    }

    function updateBursts() {
      for (let i = bursts.length - 1; i >= 0; i--) {
        const p = bursts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.965;
        p.vy *= 0.965;
        p.life -= 1;
        p.rot += p.vrot;

        const alpha = Math.max(0, p.life / p.maxLife) * 0.9;
        drawParticle(p, alpha);

        if (p.life <= 0) {
          bursts.splice(i, 1);
        }
      }
    }

    function drawCenterGlow() {
      const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.min(W, H) * 0.42);
      g.addColorStop(0, "rgba(255,215,105,0.13)");
      g.addColorStop(0.32, "rgba(80,190,255,0.08)");
      g.addColorStop(0.66, "rgba(255,65,180,0.045)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function animate() {
      t += 0.016;
      ctx.clearRect(0, 0, W, H);
      drawCenterGlow();
      updateStars();
      updateParticles();
      updateBursts();
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();

    video.play().catch(() => {});
  </script>
</body>
</html>
