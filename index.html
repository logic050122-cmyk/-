<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日蛋糕透明悬浮版</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }

    body {
      position: relative;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.82);
      width: min(70vh, 540px);
      aspect-ratio: 720 / 924;
      opacity: 0;
      animation: popIn 1200ms cubic-bezier(.2,.8,.15,1) forwards;
      pointer-events: none;
    }

    .glow {
      position: absolute;
      inset: -60px;
      background:
        radial-gradient(circle at center, rgba(255, 206, 82, 0.24), transparent 45%),
        radial-gradient(circle at 50% 35%, rgba(77, 184, 255, 0.22), transparent 40%),
        radial-gradient(circle at 50% 70%, rgba(255, 79, 163, 0.18), transparent 42%);
      filter: blur(30px);
      pointer-events: none;
    }

    .video-shell {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 0 18px rgba(255,255,255,0.08),
        0 0 40px rgba(0,0,0,0.28),
        0 0 80px rgba(255,206,82,0.18),
        0 0 120px rgba(77,184,255,0.15);
      background: rgba(0,0,0,0.06);
      backdrop-filter: blur(1px);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0.94;
      filter: saturate(1.08) brightness(1.02);
      mix-blend-mode: screen;
    }

    .edge-fade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 48%, rgba(0,0,0,0.12) 82%, rgba(0,0,0,0.2) 100%),
        linear-gradient(to right, rgba(0,0,0,0.12), transparent 8%, transparent 92%, rgba(0,0,0,0.12));
    }

    .ring {
      position: absolute;
      inset: -20px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 30px rgba(255,255,255,0.05);
      animation: pulseRing 2.8s ease-in-out infinite;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
      opacity: 0;
      animation: fadeIn 1s ease 0.9s forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.82);
      }
      55% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.016); opacity: 0.95; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 900px) {
      .wrap {
        width: min(82vw, 62vh);
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <canvas id="bgCanvas"></canvas>

    <div class="wrap">
      <div class="glow"></div>
      <div class="ring"></div>
      <div class="video-shell">
        <video id="mainVideo" autoplay muted loop playsinline preload="auto">
          <source src="生日蛋糕3.mp4" type="video/mp4" />
        </video>
        <div class="edge-fade"></div>
      </div>
    </div>

    <div class="hint">Ctrl+Shift+Q 关闭 · Ctrl+Shift+M 切换鼠标穿透</div>
  </div>

  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("mainVideo");

    let W = 0;
    let H = 0;
    let particles = [];
    let stars = [];
    let t = 0;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      createField();
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function createField() {
      particles = [];
      stars = [];
      const colors = ["#ffd84d", "#ff4fa3", "#4db8ff", "#ffffff", "#ff7a00", "#7cff6b"];

      for (let i = 0; i < Math.floor(W * H / 15000); i++) {
        stars.push({
          x: rand(0, W),
          y: rand(0, H),
          r: rand(1.2, 3.5),
          vy: rand(0.08, 0.28),
          alpha: rand(0.18, 0.65),
          glow: rand(1.5, 3.5),
          color: pick(colors)
        });
      }

      for (let i = 0; i < Math.floor(W * H / 26000); i++) {
        particles.push({
          x: W / 2 + rand(-220, 220),
          y: H / 2 + rand(-120, 120),
          vx: rand(-0.65, 0.65),
          vy: rand(-1.8, -0.15),
          size: rand(2, 6),
          life: rand(60, 130),
          maxLife: 130,
          rot: rand(0, Math.PI * 2),
          vrot: rand(-0.08, 0.08),
          color: pick(colors),
          type: Math.random() > 0.6 ? "star" : "dot"
        });
      }
    }

    function drawStar(x, y, r, color, rot = 0, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const outer = (-90 + i * 72) * Math.PI / 180;
        const inner = (-90 + i * 72 + 36) * Math.PI / 180;
        ctx.lineTo(Math.cos(outer) * r, Math.sin(outer) * r);
        ctx.lineTo(Math.cos(inner) * r * 0.45, Math.sin(inner) * r * 0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function updateParticles() {
      for (const s of stars) {
        s.y -= s.vy;
        if (s.y < -10) {
          s.y = H + 10;
          s.x = rand(0, W);
        }
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = s.alpha * 0.18;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * s.glow, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx + Math.sin(t + i * 0.3) * 0.06;
        p.y += p.vy;
        p.life -= 1;
        p.rot += p.vrot;

        const alpha = Math.max(0, p.life / p.maxLife) * 0.9;

        if (p.type === "star") {
          drawStar(p.x, p.y, p.size, p.color, p.rot, alpha);
        } else {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = alpha * 0.22;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (p.life <= 0 || p.y < -30) {
          particles[i] = {
            x: W / 2 + rand(-220, 220),
            y: H / 2 + rand(20, 180),
            vx: rand(-0.65, 0.65),
            vy: rand(-1.8, -0.15),
            size: rand(2, 6),
            life: rand(60, 130),
            maxLife: 130,
            rot: rand(0, Math.PI * 2),
            vrot: rand(-0.08, 0.08),
            color: pick(["#ffd84d", "#ff4fa3", "#4db8ff", "#ffffff", "#ff7a00", "#7cff6b"]),
            type: Math.random() > 0.6 ? "star" : "dot"
          };
        }
      }
    }

    function drawCenterGlow() {
      const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.min(W, H) * 0.33);
      g.addColorStop(0, "rgba(255,205,90,0.08)");
      g.addColorStop(0.4, "rgba(77,184,255,0.06)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function animate() {
      t += 0.016;
      ctx.clearRect(0, 0, W, H);
      drawCenterGlow();
      updateParticles();
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();

    video.play().catch(() => {});
  </script>
</body>
</html>
