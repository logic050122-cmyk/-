<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日蛋糕透明悬浮版</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }

    body {
      position: relative;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent;
      perspective: 1100px;
    }

    body.is-outro .overlay {
      animation: overlayExit 3000ms ease-in forwards;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 220, 120, 0.12), transparent 24%),
        radial-gradient(circle at 28% 42%, rgba(80, 180, 255, 0.14), transparent 30%),
        radial-gradient(circle at 72% 46%, rgba(255, 70, 180, 0.12), transparent 32%);
      animation: ambientBreath 3.4s ease-in-out infinite;
    }

    .aurora {
      position: absolute;
      inset: -18%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.58;
      filter: blur(28px);
    }

    .aurora-one {
      background:
        linear-gradient(110deg, transparent 18%, rgba(67, 190, 255, 0.2) 36%, transparent 58%),
        linear-gradient(72deg, transparent 34%, rgba(255, 96, 196, 0.16) 52%, transparent 70%);
      animation: auroraDrift 9s ease-in-out infinite;
    }

    .aurora-two {
      background:
        radial-gradient(ellipse at 24% 72%, rgba(124, 255, 107, 0.12), transparent 30%),
        radial-gradient(ellipse at 78% 26%, rgba(255, 214, 90, 0.14), transparent 33%);
      animation: auroraFloat 7.5s ease-in-out infinite;
    }

    .light-streak {
      position: absolute;
      width: 42vw;
      height: 1px;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), rgba(255, 210, 95, 0.24), transparent);
      filter: blur(0.4px);
    }

    .light-streak.one {
      left: -10vw;
      top: 26vh;
      transform: rotate(-13deg);
      animation: streakFly 4.8s ease-in-out 0.8s infinite;
    }

    .light-streak.two {
      right: -12vw;
      top: 69vh;
      transform: rotate(16deg);
      animation: streakFlyReverse 5.6s ease-in-out 1.4s infinite;
    }

    .entrance-flare {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(42vh, 360px);
      height: min(42vh, 360px);
      z-index: 2;
      transform: translate(-50%, -50%) scale(0.2);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 245, 160, 0.38), rgba(80, 190, 255, 0.12) 36%, transparent 68%);
      filter: blur(10px);
      opacity: 0;
    }

    body.is-intro .aurora,
    body.is-intro .beam,
    body.is-intro .halo-ring,
    body.is-intro .glow,
    body.is-intro .light-dust {
      opacity: 0.08;
    }

    body.is-intro .ambient {
      opacity: 0.18;
    }

    body.is-gather .ambient,
    body.is-gather .aurora {
      opacity: 0.46;
    }

    body.is-gather .beam {
      opacity: 0.28;
    }

    body.is-reveal .entrance-flare {
      animation: entranceFlare 1200ms ease-out forwards;
    }

    body.is-reveal .shockwave {
      animation: shockwave 1300ms ease-out forwards;
    }

    body.is-show .ambient,
    body.is-show .aurora {
      opacity: 0.52;
    }

    body.is-outro .halo-ring,
    body.is-outro .glow,
    body.is-outro .beam,
    body.is-outro .aurora,
    body.is-outro .light-dust {
      animation: softFadeOut 3000ms ease-in forwards;
    }

    .beam {
      position: absolute;
      top: 8%;
      width: 34vw;
      height: 84vh;
      z-index: 1;
      opacity: 0.52;
      filter: blur(10px);
      pointer-events: none;
    }

    .beam-left {
      left: 4%;
      background: linear-gradient(105deg, transparent 12%, rgba(80, 180, 255, 0.22), transparent 68%);
      transform: rotate(-8deg);
      animation: beamMoveLeft 5s ease-in-out infinite;
    }

    .beam-right {
      right: 4%;
      background: linear-gradient(75deg, transparent 12%, rgba(255, 90, 190, 0.2), transparent 68%);
      transform: rotate(8deg);
      animation: beamMoveRight 5.6s ease-in-out infinite;
    }

    .wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vh, 560px);
      aspect-ratio: 720 / 924;
      opacity: 0;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) translateY(26px) scale(0.72) rotateX(8deg);
      pointer-events: none;
      z-index: 3;
    }

    body.is-reveal .wrap {
      animation: hologramIn 1200ms cubic-bezier(.16, .9, .18, 1) forwards;
    }

    body.is-show .wrap {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotateX(0deg);
      animation: stableFloat 3.8s ease-in-out infinite;
    }

    body.is-outro .wrap {
      animation: cakeExit 3000ms cubic-bezier(.28, .02, .24, 1) forwards;
    }

    .wrap::before,
    .wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 130%;
      height: 130%;
      border-radius: 50%;
      pointer-events: none;
    }

    .wrap::before {
      background: radial-gradient(circle at center, rgba(255, 215, 105, 0.22), transparent 46%);
      filter: blur(34px);
      animation: coreGlow 2.8s ease-in-out infinite;
    }

    .wrap::after {
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 0 45px rgba(255, 215, 105, 0.15),
        inset 0 0 65px rgba(80, 180, 255, 0.08);
      opacity: 0.65;
      animation: auraRotate 8s linear infinite;
    }

    .shockwave {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255, 225, 130, 0.45);
      box-shadow: 0 0 30px rgba(255, 225, 130, 0.25);
      opacity: 0;
      z-index: 2;
    }

    .halo-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .halo-ring.one {
      width: min(78vh, 600px);
      height: min(78vh, 600px);
      transform: translate(-50%, -50%) rotateX(68deg) rotateZ(0deg);
      border: 1px solid rgba(255, 220, 120, 0.32);
      box-shadow: 0 0 26px rgba(255, 220, 120, 0.14);
      animation: ringSpin 6s linear infinite;
    }

    .halo-ring.two {
      width: min(88vh, 680px);
      height: min(88vh, 680px);
      transform: translate(-50%, -50%) rotateX(70deg) rotateZ(38deg);
      border: 1px dashed rgba(80, 190, 255, 0.22);
      box-shadow: 0 0 30px rgba(80, 190, 255, 0.08);
      animation: ringSpinReverse 9s linear infinite;
    }

    .halo-ring.three {
      width: min(58vh, 460px);
      height: min(58vh, 460px);
      transform: translate(-50%, -50%) rotateX(72deg) rotateZ(-25deg);
      border: 1px solid rgba(255, 80, 190, 0.18);
      animation: ringSpin 7.5s linear infinite;
    }

    .glow {
      position: absolute;
      inset: -70px;
      background:
        radial-gradient(circle at center, rgba(255, 215, 105, 0.30), transparent 43%),
        radial-gradient(circle at 50% 36%, rgba(82, 190, 255, 0.26), transparent 40%),
        radial-gradient(circle at 50% 70%, rgba(255, 65, 180, 0.20), transparent 43%);
      filter: blur(32px);
      opacity: 0.95;
      pointer-events: none;
      animation: glowFloat 2.6s ease-in-out infinite;
    }

    .video-shell {
      position: absolute;
      inset: 0;
      background: transparent;
      border-radius: 0;
      overflow: visible;
      box-shadow: none;
      backdrop-filter: none;
      transform: translateZ(20px);
      contain: layout paint style;
    }

    .video-shell video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 1;
      mix-blend-mode: normal;
      will-change: transform;
      backface-visibility: hidden;
    }

    .cake-body-fill {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      clip-path: polygon(
        28% 50%,
        41% 45%,
        61% 46%,
        75% 52%,
        84% 63%,
        82% 78%,
        74% 88%,
        57% 93%,
        38% 91%,
        24% 84%,
        17% 72%,
        18% 59%
      );
      background:
        radial-gradient(circle at 47% 52%, rgba(255, 230, 95, 0.5), transparent 18%),
        radial-gradient(circle at 35% 68%, rgba(25, 205, 220, 0.72), transparent 24%),
        radial-gradient(circle at 70% 67%, rgba(15, 35, 75, 0.9), transparent 31%),
        linear-gradient(180deg, rgba(28, 22, 58, 0.92), rgba(5, 14, 34, 0.98) 56%, rgba(20, 105, 170, 0.88));
      filter: saturate(1.16) brightness(1.02) contrast(1.08);
    }

    .transparent-video {
      z-index: 2;
      filter: saturate(1.12) brightness(1.05) contrast(1.05);
    }

    .light-dust {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow:
        -260px -180px 0 rgba(255, 216, 77, .65),
        240px -130px 0 rgba(77, 184, 255, .58),
        -310px 90px 0 rgba(255, 79, 163, .58),
        300px 145px 0 rgba(255, 122, 0, .55),
        -180px 210px 0 rgba(255, 255, 255, .42),
        210px 220px 0 rgba(124, 255, 107, .42);
      filter: blur(0.2px);
      opacity: 0.8;
      z-index: 4;
      animation: dustPulse 1.8s ease-in-out infinite;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.34);
      white-space: nowrap;
      opacity: 0;
      z-index: 5;
      animation: fadeIn 1s ease 1.1s forwards;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.22);
    }

    @keyframes hologramIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(42px) scale(0.62) rotateX(18deg);
        filter: blur(18px) brightness(1.8);
      }

      42% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(-8px) scale(1.06) rotateX(0deg);
        filter: blur(0) brightness(1.14);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(1) rotateX(0deg);
        filter: blur(0) brightness(1);
      }
    }

    @keyframes shockwave {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.2);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(11);
      }
    }

    @keyframes stableFloat {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0) scale(1) rotateX(0deg);
      }

      50% {
        transform: translate(-50%, -50%) translateY(-10px) scale(1.01) rotateX(1deg);
      }
    }

    @keyframes entranceFlare {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.22);
      }

      38% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.8);
      }
    }

    @keyframes cakeExit {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotateX(0deg);
        filter: blur(0) brightness(1);
      }

      45% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(-12px) scale(1.02) rotateX(0deg);
        filter: blur(0) brightness(1.16);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-40px) scale(0.86) rotateX(10deg);
        filter: blur(8px) brightness(1.45);
      }
    }

    @keyframes overlayExit {
      to {
        opacity: 0;
        filter: brightness(1.25) blur(2px);
      }
    }

    @keyframes softFadeOut {
      to {
        opacity: 0;
      }
    }

    @keyframes ambientBreath {

      0%,
      100% {
        opacity: 0.82;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes auroraDrift {
      0%, 100% {
        transform: translate3d(-2%, 0, 0) rotate(-2deg);
        opacity: 0.44;
      }

      50% {
        transform: translate3d(4%, -2%, 0) rotate(3deg);
        opacity: 0.68;
      }
    }

    @keyframes auroraFloat {
      0%, 100% {
        transform: translate3d(2%, 1%, 0) scale(1);
        opacity: 0.38;
      }

      50% {
        transform: translate3d(-3%, -2%, 0) scale(1.05);
        opacity: 0.58;
      }
    }

    @keyframes streakFly {
      0%, 60%, 100% {
        opacity: 0;
        translate: -18vw 0;
      }

      18% {
        opacity: 0.7;
      }

      42% {
        opacity: 0;
        translate: 118vw 0;
      }
    }

    @keyframes streakFlyReverse {
      0%, 62%, 100% {
        opacity: 0;
        translate: 18vw 0;
      }

      20% {
        opacity: 0.58;
      }

      46% {
        opacity: 0;
        translate: -118vw 0;
      }
    }

    @keyframes glowFloat {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.88;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes coreGlow {

      0%,
      100% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    @keyframes auraRotate {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @keyframes ringSpin {
      from {
        transform: translate(-50%, -50%) rotateX(68deg) rotateZ(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotateX(68deg) rotateZ(360deg);
      }
    }

    @keyframes ringSpinReverse {
      from {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
      }

      to {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
      }
    }

    @keyframes beamMoveLeft {

      0%,
      100% {
        transform: rotate(-9deg) translateX(0);
        opacity: 0.38;
      }

      50% {
        transform: rotate(-4deg) translateX(30px);
        opacity: 0.62;
      }
    }

    @keyframes beamMoveRight {

      0%,
      100% {
        transform: rotate(9deg) translateX(0);
        opacity: 0.34;
      }

      50% {
        transform: rotate(4deg) translateX(-30px);
        opacity: 0.58;
      }
    }

    @keyframes dustPulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.55;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.35);
        opacity: 0.95;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 900px) {
      .wrap {
        width: min(82vw, 62vh);
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body class="is-intro">
  <div class="overlay">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="ambient"></div>
    <div class="beam beam-left"></div>
    <div class="beam beam-right"></div>
    <div class="light-streak one"></div>
    <div class="light-streak two"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="shockwave"></div>
    <div class="entrance-flare"></div>
    <div class="halo-ring one"></div>
    <div class="halo-ring two"></div>
    <div class="halo-ring three"></div>

    <div class="wrap">
      <div class="glow"></div>
      <div class="video-shell">
        <div class="cake-body-fill"></div>
        <video id="mainVideo" class="transparent-video" autoplay muted playsinline preload="auto">
          <source src="生日蛋糕透明.webm" type="video/webm" />
        </video>
      </div>
    </div>

    <audio id="music1" loop preload="auto" hidden>
      <!-- http://music.163.com/song/media/outer/url?id=2066671178.mp3 -->
      <!-- http://music.163.com/song/media/outer/url?id=1963443271.mp3   生日 -->
      <!-- http://music.163.com/song/media/outer/url?id=2686588663.mp3 -->
      <source src="bgm.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <div class="light-dust"></div>
    <div class="hint">Ctrl+Shift+Q 关闭 · Ctrl+Shift+M 切换鼠标穿透</div>
  </div>

  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("mainVideo");
    const music = document.getElementById("music1");

    let W = 0;
    let H = 0;
    let particles = [];
    let stars = [];
    let bursts = [];
    let gatherParticles = [];
    let t = 0;
    let isExiting = false;
    let visualStage = "intro";
    let closeTimer = null;

    const COLORS = ["#ffd84d", "#ff4fa3", "#4db8ff", "#ffffff", "#ff7a00", "#7cff6b", "#a78bfa"];

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      createField();
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function createField() {
      particles = [];
      stars = [];
      bursts = [];
      gatherParticles = [];

      for (let i = 0; i < Math.floor(W * H / 12000); i++) {
        stars.push({
          x: rand(0, W),
          y: rand(0, H),
          r: rand(1.2, 3.8),
          vy: rand(0.08, 0.30),
          vx: rand(-0.05, 0.05),
          alpha: rand(0.16, 0.62),
          glow: rand(1.8, 4.2),
          color: pick(COLORS)
        });
      }

      for (let i = 0; i < Math.floor(W * H / 21000); i++) {
        particles.push(createFloatingParticle(rand(-240, 240), rand(-120, 160)));
      }
    }

    function createFloatingParticle(offsetX, offsetY) {
      return {
        x: W / 2 + offsetX,
        y: H / 2 + offsetY,
        vx: rand(-0.75, 0.75),
        vy: rand(-1.9, -0.18),
        size: rand(2, 6.5),
        life: rand(60, 145),
        maxLife: 145,
        rot: rand(0, Math.PI * 2),
        vrot: rand(-0.09, 0.09),
        color: pick(COLORS),
        type: Math.random() > 0.58 ? "star" : "dot"
      };
    }

    function createGatherParticle() {
      const side = Math.floor(rand(0, 4));
      let x = 0;
      let y = 0;

      if (side === 0) {
        x = rand(0, W);
        y = -30;
      } else if (side === 1) {
        x = W + 30;
        y = rand(0, H);
      } else if (side === 2) {
        x = rand(0, W);
        y = H + 30;
      } else {
        x = -30;
        y = rand(0, H);
      }

      return {
        x,
        y,
        tx: W / 2 + rand(-70, 70),
        ty: H / 2 + rand(-80, 80),
        size: rand(2, 5.5),
        life: rand(54, 92),
        maxLife: 92,
        color: pick(COLORS),
        type: Math.random() > 0.6 ? "star" : "dot",
        rot: rand(0, Math.PI * 2),
        vrot: rand(-0.1, 0.1)
      };
    }

    function drawStar(x, y, r, color, rot = 0, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const outer = (-90 + i * 72) * Math.PI / 180;
        const inner = (-90 + i * 72 + 36) * Math.PI / 180;
        ctx.lineTo(Math.cos(outer) * r, Math.sin(outer) * r);
        ctx.lineTo(Math.cos(inner) * r * 0.45, Math.sin(inner) * r * 0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawParticle(p, alpha) {
      if (p.type === "star") {
        drawStar(p.x, p.y, p.size * 1.35, p.color, p.rot, alpha);
        return;
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = alpha * 0.24;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function updateStars() {
      const stageAlpha = visualStage === "intro" ? 0.28 : visualStage === "gather" ? 0.62 : visualStage === "outro" ? 0.42 : 1;

      for (const s of stars) {
        s.y -= s.vy;
        s.x += s.vx + Math.sin(t + s.y * 0.01) * 0.035;

        if (s.y < -10) {
          s.y = H + 10;
          s.x = rand(0, W);
        }

        ctx.globalAlpha = s.alpha * stageAlpha * (0.72 + Math.sin(t * 2 + s.x * 0.02) * 0.22);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha *= 0.18;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * s.glow, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function updateParticles() {
      const stageAlpha = visualStage === "intro" ? 0.12 : visualStage === "gather" ? 0.5 : visualStage === "outro" ? 0.75 : 1;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx + Math.sin(t + i * 0.35) * 0.08;
        p.y += p.vy;
        p.life -= 1;
        p.rot += p.vrot;

        const alpha = Math.max(0, p.life / p.maxLife) * 0.86 * stageAlpha;
        drawParticle(p, alpha);

        if (p.life <= 0 || p.y < -40) {
          if (isExiting) {
            particles.splice(i, 1);
            continue;
          }

          particles[i] = createFloatingParticle(rand(-240, 240), rand(30, 210));
        }
      }
    }

    function updateBursts() {
      for (let i = bursts.length - 1; i >= 0; i--) {
        const p = bursts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.965;
        p.vy *= 0.965;
        p.life -= 1;
        p.rot += p.vrot;

        const alpha = Math.max(0, p.life / p.maxLife) * 0.9;
        drawParticle(p, alpha);

        if (p.life <= 0) {
          bursts.splice(i, 1);
        }
      }
    }

    function drawCenterGlow() {
      const glowAlpha = visualStage === "intro" ? 0.28 : visualStage === "gather" ? 0.88 : visualStage === "outro" ? 0.55 : 1;
      const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.min(W, H) * 0.42);
      g.addColorStop(0, `rgba(255,215,105,${0.13 * glowAlpha})`);
      g.addColorStop(0.32, `rgba(80,190,255,${0.08 * glowAlpha})`);
      g.addColorStop(0.66, `rgba(255,65,180,${0.045 * glowAlpha})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function addBurst(count, speedMin, speedMax, sizeMin, sizeMax) {
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const speed = rand(speedMin, speedMax);
        bursts.push({
          x: W / 2,
          y: H / 2,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          size: rand(sizeMin, sizeMax),
          life: rand(28, 76),
          maxLife: 76,
          rot: rand(0, Math.PI * 2),
          vrot: rand(-0.15, 0.15),
          color: pick(COLORS),
          type: Math.random() > 0.45 ? "star" : "dot"
        });
      }
    }

    function addGather(count) {
      for (let i = 0; i < count; i++) {
        gatherParticles.push(createGatherParticle());
      }
    }

    function setStage(stage) {
      visualStage = stage;
      document.body.classList.remove("is-intro", "is-gather", "is-reveal", "is-show", "is-outro");
      document.body.classList.add(`is-${stage}`);
    }

    function fadeMusicTo(targetVolume, duration) {
      const startVolume = music.volume;
      const startedAt = performance.now();

      function step(now) {
        const progress = Math.min(1, (now - startedAt) / duration);
        music.volume = startVolume + (targetVolume - startVolume) * progress;

        if (progress < 1) {
          requestAnimationFrame(step);
        } else if (targetVolume <= 0) {
          music.pause();
        }
      }

      requestAnimationFrame(step);
    }

    function closeApp() {
      if (window.appControl && window.appControl.close) {
        window.appControl.close();
        return;
      }

      window.close();
    }

    function updateGatherParticles() {
      for (let i = gatherParticles.length - 1; i >= 0; i--) {
        const p = gatherParticles[i];
        const pull = visualStage === "outro" ? -0.015 : 0.035;

        p.x += (p.tx - p.x) * pull;
        p.y += (p.ty - p.y) * pull;
        p.life -= 1;
        p.rot += p.vrot;

        const alpha = Math.max(0, p.life / p.maxLife) * 0.95;
        drawParticle(p, alpha);

        if (p.life <= 0) {
          gatherParticles.splice(i, 1);
        }
      }
    }

    function animate() {
      t += 0.016;
      ctx.clearRect(0, 0, W, H);
      drawCenterGlow();
      updateStars();
      updateGatherParticles();
      updateParticles();
      updateBursts();
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();

    function startMedia() {
      music.volume = 0;

      video.play().catch((error) => {
        console.log("视频播放失败：", error);
      });

      music.play().catch((error) => {
        console.log("音乐播放失败，请确认 bgm.mp3 在项目根目录：", error);
      });
    }

    window.startExitAnimation = function () {
      if (isExiting) return true;

      isExiting = true;
      setStage("outro");
      addBurst(110, 1.8, 6.2, 1.8, 6.5);
      fadeMusicTo(0, 3000);

      return true;
    };

    function scheduleTimeline() {
      setStage("intro");

      setTimeout(() => {
        setStage("gather");
        addGather(90);
        fadeMusicTo(0.45, 2000);
      }, 800);

      setTimeout(() => {
        setStage("reveal");
        video.currentTime = 0;
        video.play().catch(() => { });
        addBurst(56, 1.3, 4.6, 1.8, 6.2);
      }, 1800);

      setTimeout(() => {
        setStage("show");
      }, 3000);

      setTimeout(() => {
        window.startExitAnimation();
      }, 10000);

      closeTimer = setTimeout(() => {
        closeApp();
      }, 13000);
    }

    startMedia();
    scheduleTimeline();
  </script>
</body>

</html>
